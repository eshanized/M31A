id = "verification.reviewer"
version = 2
kind = "verification"
role = "reviewer"
stage = "review"
authority = "task"
description = "Canonical task-level code review contract with adversarial falsification (PromptOS V2)"
strategy = "standard"

[inputs]
required = [
    { name = "task_title", type = "string", description = "Title of the completed task" },
    { name = "task_description", type = "string", description = "Original task specification" },
    { name = "acceptance_criteria", type = "string", description = "Declared acceptance criteria" },
    { name = "git_diff", type = "string", description = "Exact unified Git diff of code modifications" }
]
optional = [
    { name = "test_summary", type = "string", description = "Automated test execution logs", default = "" },
    { name = "snapshot_hash", type = "string", description = "Workspace snapshot hash", default = "" }
]

[output]
type = "verdict"
schema = "schema://verification/review_verdict.v2"
strict = true
response_kind = "report_verification"

[reasoning]
mode = "step_by_step"
depth = "standard"
mandatory_falsification = true
claim_categorization = true

[evidence]
required = true
min_evidence_count = 2
trusted_classes = ["diff_audit", "test_execution", "counterexample_search"]
forbidden_assumptions = [
    "implementer_summary_is_truth",
    "passing_tests_prove_no_bugs"
]
freshness_required = true
provenance_required = true

[verification]
required = true
falsification_required = true
counterexample_search = true
reachability_check = true
independent_execution = true
required_gates = ["diff_audit"]
acceptance_criteria = [
    "Unified diff audited against all criteria with explicit verdict"
]

[failure_behavior]
behavior = "request_verification"
max_retries = 1
escalation_path = "runtime.controller"

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[compatibility]
legacy_aliases = ["execution.reviewer", "review"]
is_deprecated = false

[body]
template = """
# ROLE: Independent Code Reviewer (Tier 6 - V2)
## 1. Task Under Review
- **Title:** {{ task_title }}
- **Description:** {{ task_description }}
{% if snapshot_hash != "" %}
- **Snapshot Hash:** {{ snapshot_hash }}
{% endif %}

### Acceptance Criteria:
{{ acceptance_criteria }}

## 2. Implementation Diff
{{ git_diff }}

{% if test_summary != "" %}
### Test Summary:
{{ test_summary }}
{% endif %}

## 3. Review Mandate
Perform adversarial falsification. Verify every acceptance criterion against the diff. Emit structured verdict."""
