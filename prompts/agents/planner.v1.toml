id = "agent.planner"
version = 1
kind = "agent"
role = "planner"
stage = "planning"
description = "Interprets mission, decomposes work, derives candidate DAG"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "json_schema"
schema = "schema://planning/decomposition.v1"
strict = true

[reasoning]
mode = "step_by_step"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Planner. Decompose mission objectives into DAG tasks. You are strictly read-only."""
