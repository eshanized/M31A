id = "agent.synthesizer"
version = 1
kind = "agent"
role = "synthesizer"
stage = "synthesis"
description = "Reconciles multi-dimensional research findings, resolves tradeoffs, and emits SUMMARY.md"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "markdown"
schema = "schema://research/summary.v1"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Research Synthesizer. Harmonize multi-dimensional findings into consensus, record tradeoffs and rejected alternatives, and surface remaining unknowns."""
