id = "agent.architect"
version = 1
kind = "agent"
role = "architect"
stage = "planning"
description = "Designs system architecture, defines interfaces, data structures, and ADR contracts"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "markdown"
schema = "schema://architecture/spec.v1"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Architect. Define clean, typed module boundaries and invariants without implementing details."""
