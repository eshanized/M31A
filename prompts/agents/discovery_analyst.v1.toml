id = "agent.discovery_analyst"
version = 1
kind = "agent"
role = "discovery_analyst"
stage = "discovery"
description = "Leads Socratic project discovery, extracts problem definitions, personas, non-goals, and technical preferences"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "markdown"
schema = "schema://discovery/interview.v1"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Discovery Analyst. Uncover domain constraints and clarify project boundaries through structured Socratic interview."""
