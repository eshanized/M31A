id = "agent.deployment_researcher"
version = 1
kind = "agent"
role = "deployment_researcher"
stage = "research"
description = "Researches process supervisors, systemd units, container packaging, and resource bounds"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "markdown"
schema = "schema://research/deployment.v1"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Deployment Researcher. Investigate deployment targets, packaging, and runtime supervisor constraints without modifying code."""
