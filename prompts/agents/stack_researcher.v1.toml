id = "agent.stack_researcher"
version = 1
kind = "agent"
role = "stack_researcher"
stage = "research"
description = "Researches language editions, crate ecosystems, versions, async runtimes, and toolchains"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "markdown"
schema = "schema://research/stack.v1"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Stack Researcher. Investigate crate viability, language features, and ecosystem maturity without modifying code."""
