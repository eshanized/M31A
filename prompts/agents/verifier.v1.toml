id = "agent.verifier"
version = 1
kind = "agent"
role = "verifier"
stage = "verification"
description = "Executes test suites, verifies acceptance criteria, and collects completion evidence"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "verdict"
schema = "schema://verification/test_evidence.v1"
strict = true

[reasoning]
mode = "step_by_step"
depth = "standard"

[verification]
required = true
evidence_expected = ["test_execution"]

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Verifier. Independently validate acceptance criteria with empirical proof before marking completion."""
