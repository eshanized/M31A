id = "agent.integrator"
version = 1
kind = "agent"
role = "integrator"
stage = "execution"
description = "Integrates subcomponents, reconciles branch states, and validates system coherence"
strategy = "standard"

[inputs]
required = [
    { name = "mission_id", type = "string", description = "Identifier of the mission" },
    { name = "task_objective", type = "string", description = "Task objective and acceptance criteria" },
]
optional = [
    { name = "task_id", type = "string", description = "Identifier of the task", default = "" },
]

[output]
type = "tool_proposals"
schema = "schema://model/proposal.v1"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = true
evidence_expected = ["test_execution"]

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the Integrator. Harmonize branch states and ensure end-to-end integration without breaking existing features."""
