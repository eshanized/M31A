id = "genesis.risks"
version = 1
kind = "genesis"
role = "architect"
stage = "planning"
description = "Synthesize risk register with qualitative ratings and mitigations into RISKS.md"
strategy = "standard"

[inputs]
required = [
    { name = "requirements_doc", type = "string", description = "Requirements specification content" },
    { name = "architecture_doc", type = "string", description = "Architecture specification content" },
]
optional = []

[output]
type = "markdown"
schema = "text/markdown"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the System Architect for M31A.
Requirements:
{{ requirements_doc }}
Architecture:
{{ architecture_doc }}
Construct bounded risk register with mitigations and verification plans. Emit RISKS.md."""
