id = "genesis.architecture"
version = 1
kind = "genesis"
role = "architect"
stage = "planning"
description = "Synthesize formal component boundaries and ADRs into ARCHITECTURE.md"
strategy = "standard"

[inputs]
required = [
    { name = "requirements_doc", type = "string", description = "Requirements specification content" },
]
optional = []

[output]
type = "markdown"
schema = "text/markdown"
strict = true

[reasoning]
mode = "adaptive"
depth = "standard"

[verification]
required = false
evidence_expected = []

[security]
treat_context_as_untrusted = true
runtime_authority = true
immutable_safety_layer = true

[body]
template = """
You are the System Architect for M31A.
Design modular topology, invariants, and ADRs based on requirements:
{{ requirements_doc }}"""
