name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: stable

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Verify workspace formatting
        run: cargo fmt --all -- --check

      - name: Verify workspace clippy with -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-suite:
    name: Workspace Tests (Nextest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run workspace unit and integration tests (Nextest)
        run: env -u NVIDIA_API_KEY cargo nextest run --workspace --all-targets

      - name: Run documentation tests
        run: cargo test --workspace --doc

      - name: Run workspace trust verification suite
        run: cargo test -p m31a-trust

      - name: Run slash-command consistency and keybinding suite
        run: cargo test -p m31a-composer -p m31a-tui

      - name: Run integrity verification test suite
        run: cargo test -p m31a-verify

      - name: Run architectural maturity e2e test
        run: cargo test -p m31a-agent-engine --test architectural_maturity_e2e_test

  cross-platform-build:
    name: Build Verification (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap musl-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-
            ${{ runner.os }}-cargo-

      - name: Build M31A CLI release binary
        run: cargo build --release -p m31a-cli --bin m31a --target ${{ matrix.target }}

  release-packaging:
    name: Release Packaging Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Install cargo-dist
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist

      - name: Configure cargo-dist binary symlink
        run: ln -sf "$HOME/.cargo/bin/dist" "$HOME/.cargo/bin/cargo-dist"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-dist-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dist-

      - name: Plan release distribution
        run: cargo dist plan

      - name: Build host release artifacts
        run: cargo dist build --artifacts=host

      - name: Upload local packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m31a-release-artifacts
          path: target/distrib/
          retention-days: 7

  sdk-verification:
    name: SDK Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python SDK tests
        run: PYTHONPATH=sdk/python python3 -m unittest discover -s sdk/python/tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TypeScript SDK tests
        run: |
          cd sdk/typescript
          npm ci
          npm test

  schema-verification:
    name: Protocol Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify schema extraction
        run: |
          python3 scripts/extract_protocol_schema.py schemas/app_server/schema.json
          git diff --exit-code schemas/

  e2e-benchmark:
    name: E2E Benchmark
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Build M31A CLI binary for benchmark
        run: cargo build --release -p m31a-cli --bin m31a

      - name: Run E2E benchmark
        run: python3 scripts/benchmark_runner.py --name bench_full_session --iterations 5 --output benchmark_results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 7

  live-nvidia-suite:
    name: Live NVIDIA NIM Verification Suite
    needs: [test-suite]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set default Rust toolchain
        run: rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run live provider integration tests
        env:
          M31A_RUN_LIVE_NVIDIA_TESTS: "1"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY is not configured; skipping live integration tests."
            exit 0
          fi
          cargo test -p m31a-provider --features live-nvidia-tests --test live_provider_test -- --ignored --test-threads=1
          cargo test -p m31a-agent-engine --features live-nvidia-tests --test live_nvidia_e2e -- --ignored --test-threads=1
          cargo test -p m31a-cli --features live-nvidia-tests --test live_nvidia_cli -- --ignored --test-threads=1
          cargo test -p m31a-tui --features live-nvidia-tests --test live_nvidia_activation -- --ignored --test-threads=1
