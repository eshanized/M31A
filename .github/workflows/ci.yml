name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Create temp directory
        run: mkdir -p ${{ runner.workspace }}/tmp
      - name: Run tests
        run: go test -race -timeout 30s -coverprofile=coverage.out -covermode=atomic ./...
        env:
          TMPDIR: ${{ runner.workspace }}/tmp
      - name: Run go vet
        run: go vet ./...
      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Build debug binary
        run: CGO_ENABLED=0 go build -gcflags="all=-N -l" -o bin/m31a-debug ./cmd/m31a

  pprof-smoke:
    runs-on: ubuntu-latest
    needs: debug-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Build debug binary
        run: CGO_ENABLED=0 go build -gcflags="all=-N -l" -o bin/m31a-debug ./cmd/m31a
      - name: Verify pprof responds
        run: |
          M31A_DEBUG=1 ./bin/m31a-debug &
          sleep 3
          curl -sf http://localhost:6060/debug/pprof/ > /dev/null
          kill %1

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=5 -run=^$ ./internal/performance/ > new.txt
      - name: Fetch baseline from main
        run: |
          git stash --include-untracked
          git checkout main -- internal/performance/
          go test -bench=. -benchmem -count=5 -run=^$ ./internal/performance/ > old.txt || echo "No baseline available"
          git checkout -- .
          git stash pop || true
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Check for regressions
        run: |
          if [ -f old.txt ] && grep -q "Benchmark" old.txt; then
            benchstat -delta 50% old.txt new.txt
          else
            echo "No baseline available, skipping regression check"
          fi

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
        go: ["1.25.12"]
        exclude:
          - os: windows-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build -o m31a ./cmd/m31a
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
      - name: Vet
        run: go vet ./...
        env:
          GOARCH: ${{ matrix.arch }}

  release:
    needs: [lint, test, security, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tests already passed in the test job — no redundant re-run here
