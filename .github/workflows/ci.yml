name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

  test-tier1:
    name: Test Tier 1 (Full -race)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: macos-latest
            arch: amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run tests with race detector
        run: go test -race -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
        env:
          GOARCH: ${{ matrix.arch }}
      - name: Run go vet
        run: go vet ./...
        env:
          GOARCH: ${{ matrix.arch }}
      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.arch }}
          path: coverage.out

  test-tier2:
    name: Test Tier 2 (Smoke)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: amd64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Smoke test - build binary
        run: |
          CGO_ENABLED=0 go build -o m31a ./cmd/m31a
        env:
          GOARCH: ${{ matrix.arch }}
      - name: Smoke test - binary runs (version)
        run: |
          ./m31a --version
        env:
          GOARCH: ${{ matrix.arch }}
      - name: Smoke test - at least one test passes (short)
        run: |
          go test -short -timeout 5m ./...
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build debug binary
        run: CGO_ENABLED=0 go build -gcflags="all=-N -l" -o bin/m31a-debug ./cmd/m31a

  pprof-smoke:
    runs-on: ubuntu-latest
    needs: debug-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build debug binary
        run: CGO_ENABLED=0 go build -gcflags="all=-N -l" -o bin/m31a-debug ./cmd/m31a
      - name: Verify pprof responds
        run: |
          M31A_DEBUG=1 ./bin/m31a-debug &
          sleep 3
          curl -sf http://localhost:6060/debug/pprof/ > /dev/null
          kill %1

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=10 -run=^$ ./... > new.txt
      - name: Fetch baseline from main
        run: |
          git stash --include-untracked
          git checkout main -- .
          go test -bench=. -benchmem -count=10 -run=^$ ./... > old.txt || echo "No baseline available"
          git checkout -- .
          git stash pop || true
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Check for regressions
        run: |
          if [ -f old.txt ] && grep -q "Benchmark" old.txt; then
            benchstat -delta 50% old.txt new.txt | tee benchstat-output.txt
            if grep -q "p=0.0" benchstat-output.txt; then
              echo "::error::Performance regression detected (>50%)"
              exit 1
            fi
          else
            echo "No baseline available"
          fi
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            new.txt
            old.txt
            benchstat-output.txt
      - name: Commit benchmark data to gh-pages (master only)
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages || git checkout --orphan gh-pages
          mkdir -p benchmarks
          cp benchstat-output.txt benchmarks/benchstat-$(date +%Y%m%d).txt
          git add benchmarks/
          git commit -m "chore(benchmarks): update benchmark data" || echo "No changes"
          git push origin gh-pages

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
        go: ["1.26.5"]
        exclude:
          - os: windows-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build -o m31a ./cmd/m31a
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
      - name: Vet
        run: go vet ./...
        env:
          GOARCH: ${{ matrix.arch }}

  crash-capture:
    runs-on: ubuntu-latest
    needs: test-tier1
    if: always()
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Download test logs for crash detection
        if: always()
        run: |
          echo "Checking test logs for CRASH markers..."
          # Check if test job produced any crash output
          if [ -n "${{ needs.test-tier1.result }}" ] && [ "${{ needs.test-tier1.result }}" != "success" ]; then
            echo "Test job failed - checking for crash artifacts"
            ls -la ${{ runner.workspace }}/tmp/ 2>/dev/null || true
          fi
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: |
            ${{ runner.workspace }}/tmp/crash-*.json
            ~/.m31a/crashes/*.json
      - name: Auto-file crash issue
        if: failure() || always()
        run: |
          # Look for crash output in test logs
          if [ -f "${{ runner.workspace }}/tmp/crash-*.json" ] 2>/dev/null || [ -f "~/.m31a/crashes/crash-*.json" ] 2>/dev/null; then
            echo "Crash artifacts found, filing issue..."
            CRASH_FILE=$(find ~/.m31a/crashes/ -name "crash-*.json" 2>/dev/null | head -1)
            if [ -z "$CRASH_FILE" ]; then
              CRASH_FILE=$(find ${{ runner.workspace }}/tmp/ -name "crash-*.json" 2>/dev/null | head -1)
            fi
            if [ -n "$CRASH_FILE" ]; then
              STACK_TRACE=$(cat "$CRASH_FILE" | jq -r '.stack_trace // empty')
              PANIC_VALUE=$(cat "$CRASH_FILE" | jq -r '.panic_value // empty')
              VERSION=$(cat "$CRASH_FILE" | jq -r '.version // "unknown"')
              if [ -n "$STACK_TRACE" ] && [ -n "$PANIC_VALUE" ]; then
                echo "## Crash Information" > body.md
                echo "**Version:** $VERSION" >> body.md
                echo "**OS:** $(cat "$CRASH_FILE" | jq -r '.os // "unknown"')" >> body.md
                echo "**Go Version:** $(cat "$CRASH_FILE" | jq -r '.go_version // "unknown"')" >> body.md
                echo "## Stack Trace" >> body.md
                echo "\`\`\`" >> body.md
                echo "$STACK_TRACE" >> body.md
                echo "\`\`\`" >> body.md
                echo "## Steps to Reproduce" >> body.md
                echo "1. Run the failing test suite" >> body.md
                echo "2. Observe crash" >> body.md
                echo "## Expected Behavior" >> body.md
                echo "No panic should occur." >> body.md
                echo "## Additional Context" >> body.md
                echo "Auto-filed from CI crash capture workflow." >> body.md

                gh issue create \
                  --repo "${{ github.repository }}" \
                  --title "[CRASH] $PANIC_VALUE in $VERSION" \
                  --body-file body.md
              else
                echo "No crash details to report"
              fi
            else
              echo "No crash file found"
            fi
          else
            echo "No crash artifacts detected"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [lint, test-tier1, test-tier2, security, build, benchmark, crash-capture]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}