name: 'CI'

on:
  push:
    branches:
      - 'master'
      - 'release/**'
  pull_request:
    branches:
      - 'master'
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: |-
    ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release/') }}

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  lint:
    name: 'Lint & Typecheck'
    runs-on: 'ubuntu-latest'
    env:
      M31A_LINT_TEMP_DIR: '${{ github.workspace }}/.m31a-linters'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Check lockfile'
        run: 'npm run check:lockfile'

      - name: 'Build packages'
        run: 'npm run build'

      - name: 'Typecheck'
        run: 'npm run typecheck'

      - name: 'Check formatting'
        run: 'node scripts/lint.js --prettier'

      - name: 'Check GitHub Actions pinning'
        run: 'node scripts/lint.js --check-github-actions-pinning'

      - name: 'Install workflow linters'
        run: 'node scripts/lint.js --setup'

      - name: 'Run actionlint and yamllint'
        run: 'node scripts/lint.js --actionlint --yamllint'

      - name: 'Run ESLint'
        run: 'node scripts/lint.js --eslint'

  test:
    name: 'Test (${{ matrix.node-version }}, ${{ matrix.shard }})'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '20.x'
          - '22.x'
        shard:
          - 'cli'
          - 'others'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'

      - name: 'Install system dependencies'
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build packages'
        run: 'npm run build'

      - name: 'Run tests'
        env:
          NO_COLOR: 'true'
          M31A_TRUST_WORKSPACE: 'true'
        run: |
          if [[ "${{ matrix.shard }}" == "cli" ]]; then
            npm run test:ci --workspace '@m31a/cli' -- --coverage.enabled=false
          else
            npm run test:ci --workspace '@m31a/core' --workspace '@m31a/genai' --workspace '@m31a/devtools' --workspace '@m31a/test-utils' --if-present -- --coverage.enabled=false
            npm run test:scripts
            npm run test:sea-launch
          fi

      - name: 'Bundle CLI'
        run: 'npm run bundle'

      - name: 'Smoke test bundle'
        run: 'node ./bundle/m31a.js --version'

      - name: 'Smoke test npx tarball'
        run: |
          TARBALL=$(npm pack | tail -n 1)
          mkdir -p ../smoke-test-dir
          mv "$TARBALL" ../smoke-test-dir/
          cd ../smoke-test-dir
          npx --yes "./$TARBALL" --version

      - name: 'Upload test reports'
        if: '${{ always() }}'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'junit-${{ matrix.node-version }}-${{ matrix.shard }}'
          path: 'packages/*/junit.xml'
          if-no-files-found: 'ignore'

  test_macos:
    name: 'Smoke Test (macOS)'
    runs-on: 'macos-latest'
    continue-on-error: true
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build and bundle'
        run: 'npm run build && npm run bundle'

      - name: 'Run script and SEA launcher tests'
        run: 'npm run test:scripts && npm run test:sea-launch'

      - name: 'Smoke test bundle'
        run: 'node ./bundle/m31a.js --version'

  ci:
    name: 'CI Gate'
    if: '${{ always() }}'
    needs:
      - 'lint'
      - 'test'
      - 'test_macos'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Verify required CI jobs'
        env:
          LINT_RESULT: '${{ needs.lint.result }}'
          TEST_RESULT: '${{ needs.test.result }}'
        run: |
          if [[ "${LINT_RESULT}" != "success" || "${TEST_RESULT}" != "success" ]]; then
            echo "Required CI jobs failed (lint=${LINT_RESULT}, test=${TEST_RESULT})."
            exit 1
          fi
          echo "All required CI jobs passed."
