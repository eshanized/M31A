# ARM64 Linux CI workflow for Phase 48 cross-platform verification.

name: linux-arm64

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep SQLite temp files on-workspace
  TMPDIR: ${{ github.workspace }}/tmp

jobs:
  check:
    name: "Linux ARM64 check"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo check --all-targets
        run: cargo check --all-targets
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (platform-neutral + Linux-specific)
        run: |
          cargo test --test production_comment_hygiene
          cargo test --test architecture_process_authority
          cargo test --test docs_contract
          cargo test --test phase_01_events_ids_kernel
          cargo test --test phase_01_state_machines
          cargo test --test phase_11_cli
          cargo test --test phase_11_config
          cargo test --test platform -- --test-threads 1