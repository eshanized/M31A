name: CI - Debug

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build debug binary
        run: go build -gcflags="all=-N -l" -o bin/m31a-debug ./cmd/m31a
        env:
          CGO_ENABLED: "0"

  pprof-smoke:
    runs-on: ubuntu-latest
    needs: debug-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build debug binary
        run: go build -gcflags="all=-N -l" -o bin/m31a-debug ./cmd/m31a
        env:
          CGO_ENABLED: "0"
      - name: Verify pprof responds
        run: |
          script -e -q -c "M31A_DEBUG=1 ./bin/m31a-debug" /dev/null &
          sleep 3
          curl -sf http://localhost:6060/debug/pprof/ > /dev/null
          kill %1
