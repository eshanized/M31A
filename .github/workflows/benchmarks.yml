name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:
  workflow_call:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: benchmarks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for baseline comparison
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run benchmarks (current)
        run: go test -bench=. -benchmem -count=10 -run=^$ ./... > new.txt
      - name: Fetch baseline from main
        run: |
          git stash --include-untracked
          git checkout master -- .
          go test -bench=. -benchmem -count=10 -run=^$ ./... > old.txt || echo "No baseline"
          git checkout -- .
          git stash pop || true
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Check for regressions
        run: |
          if [ -f old.txt ] && grep -q "Benchmark" old.txt; then
            benchstat -delta 50% old.txt new.txt | tee benchstat-output.txt
            # Fail on regression > 50%
            if grep -q "p=0.0" benchstat-output.txt; then
              echo "::error::Performance regression detected"
              exit 1
            fi
          else
            echo "No baseline available"
          fi
      - name: Generate benchstat JSON output
        if: github.ref == 'refs/heads/master'
        run: |
          if [ -f old.txt ] && grep -q "Benchmark" old.txt; then
            benchstat -format json old.txt new.txt > benchstat-results.json
            echo "Generated benchstat-results.json"
          else
            echo "No baseline available for JSON output"
          fi
      - name: Generate HTML dashboard
        if: github.ref == 'refs/heads/master'
        run: |
          cp scripts/dashboard-template.html dashboard.html
          sed -i "s|COMMIT_SHA|${{ github.sha }}|g" dashboard.html
          echo "Generated dashboard.html"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            new.txt
            old.txt
            benchstat-output.txt
            benchstat-results.json
            dashboard.html
      - name: Commit benchmark data to gh-pages (master only)
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages || git checkout --orphan gh-pages
          mkdir -p benchmarks
          cp benchstat-output.txt benchmarks/benchstat-$(date +%Y%m%d).txt
          cp benchstat-results.json benchmarks/benchstat-results.json
          cp dashboard.html dashboard.html
          git add benchmarks/ dashboard.html
          git commit -m "chore(benchmarks): update benchmark data and dashboard" || echo "No changes"
          git push origin gh-pages
      - name: Output dashboard URL to summary
        if: github.ref == 'refs/heads/master'
        run: |
          echo "## Benchmark Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "View the [benchmark dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Old | New | Delta | p-value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|-----|-------|---------|" >> $GITHUB_STEP_SUMMARY
          if [ -f benchstat-results.json ]; then
            cat benchstat-results.json | jq -r '.[] | "| \(.name) | \(.["ns/op"].old | floor) | \(.["ns/op"].new | floor) | \(((.["ns/op"].new - .["ns/op"].old) / .["ns/op"].old * 100) | floor) | \(.p | tostring) |"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi