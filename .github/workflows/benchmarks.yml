name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: benchmarks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for baseline comparison
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Run benchmarks (current)
        run: go test -bench=. -benchmem -count=10 -run=^$ ./... > new.txt
      - name: Fetch baseline from main
        run: |
          git stash --include-untracked
          git checkout main -- .
          go test -bench=. -benchmem -count=10 -run=^$ ./... > old.txt || echo "No baseline"
          git checkout -- .
          git stash pop || true
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Check for regressions
        run: |
          if [ -f old.txt ] && grep -q "Benchmark" old.txt; then
            benchstat -delta 50% old.txt new.txt | tee benchstat-output.txt
            # Fail on regression > 50%
            if grep -q "p=0.0" benchstat-output.txt; then
              echo "::error::Performance regression detected"
              exit 1
            fi
          else
            echo "No baseline available"
          fi
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            new.txt
            old.txt
            benchstat-output.txt
      - name: Commit benchmark data to gh-pages (master only)
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages || git checkout --orphan gh-pages
          mkdir -p benchmarks
          cp benchstat-output.txt benchmarks/benchstat-$(date +%Y%m%d).txt
          git add benchmarks/
          git commit -m "chore(benchmarks): update benchmark data" || echo "No changes"
          git push origin gh-pages