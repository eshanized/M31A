name: Bazel CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  BAZEL_VERSION: "7.4.0"
  USE_BAZEL_VERSION: "7.4.0"
  BAZELISK_VERSION: "1.25.0"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x86_64_gnu
            bazel_platform: //bazel/platforms:linux_x86_64_gnu
          - os: ubuntu-latest
            platform: linux_x86_64_musl
            bazel_platform: //bazel/platforms:linux_x86_64_musl
          - os: macos-latest
            platform: macos_x86_64
            bazel_platform: //bazel/platforms:macos_x86_64
          - os: macos-latest
            platform: macos_arm64
            bazel_platform: //bazel/platforms:macos_arm64
          - os: windows-latest
            platform: windows_x86_64_msvc
            bazel_platform: //bazel/platforms:windows_x86_64_msvc
          - os: windows-latest
            platform: windows_x86_64_gnullvm
            bazel_platform: //bazel/platforms:windows_x86_64_gnullvm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'linux_x86_64_musl' && 'x86_64-unknown-linux-musl' || '' }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap musl-tools

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true

      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target/
          key: bazel-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock', '**/BUILD.bazel', '**/MODULE.bazel') }}

      - name: Build with Bazel
        run: |
          bazel build --platforms=${{ matrix.bazel_platform }} //bazel:m31a

      - name: Run tests
        run: |
          bazel test --platforms=${{ matrix.bazel_platform }} //... --test_output=all

      - name: Build release archives
        if: matrix.platform == 'linux_x86_64_gnu' || matrix.platform == 'linux_x86_64_musl' || matrix.platform == 'macos_x86_64' || matrix.platform == 'macos_arm64' || matrix.platform == 'windows_x86_64_msvc'
        run: |
          bazel build --platforms=${{ matrix.bazel_platform }} //bazel:m31a_release

      - name: Upload release artifacts
        if: matrix.platform == 'linux_x86_64_gnu' || matrix.platform == 'linux_x86_64_musl' || matrix.platform == 'macos_x86_64' || matrix.platform == 'macos_arm64' || matrix.platform == 'windows_x86_64_msvc'
        uses: actions/upload-artifact@v4
        with:
          name: m31a-${{ matrix.platform }}
          path: bazel-bin/bazel/m31a_release_*/
          retention-days: 7

  e2e-benchmark:
    name: E2E Benchmark
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}

      - name: Run E2E benchmarks
        run: |
          bazel run //bazel:bench_full_session --platforms=//bazel/platforms:linux_x86_64_gnu

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json