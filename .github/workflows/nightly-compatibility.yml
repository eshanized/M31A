name: Nightly - Compatibility

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compat-matrix:
    name: Compatibility Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nodejs npm rustc cargo python3
      - name: Run compatibility matrix
        run: bash scripts/compat-matrix.sh --output compat-results.json
      - name: Validate JSON output
        run: jq . compat-results.json > /dev/null
      - name: Upload compatibility results
        uses: actions/upload-artifact@v4
        with:
          name: compat-results
          path: compat-results.json
      - name: Create issue on low pass rate
        if: failure() && hashFiles('compat-results.json') != ''
        run: |
          PASS_RATE=$(jq -r '.pass_rate' compat-results.json)
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Nightly] Compatibility matrix pass rate below 80%" \
            --body "Compatibility matrix pass rate: ${PASS_RATE}% (below 80%). See the compat-results artifact for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
