name: Nightly - Extensions

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build custom-linter example
        run: go build -o /tmp/custom-linter ./docs/examples/custom-linter
      - name: Build ollama-provider example
        run: go build -o /tmp/ollama-provider ./docs/examples/ollama-provider
      - name: Build pre-commit-hook example
        run: go build -o /tmp/pre-commit-hook ./docs/examples/pre-commit-hook
