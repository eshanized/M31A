# M31A canonical CI release gates.
#
# Taxonomy (single, unified — see src/release/status.rs):
#   DETERMINISTIC ......... must pass; failure blocks the RC.
#   LIVE .................. mandatory real-provider acceptance; missing credentials
#                           or failed/skipped live tests block this workflow.
#   OPTIONAL .............. advisory only (cargo-audit if installed).
#   ENVIRONMENT-BLOCKED ... host-gated (tmpfs scratch); uses TMPDIR override.
#
# scripts/release-check.sh defines the local pre-release gate set. CI adds
# full multi-target testing and mandatory credential-enabled live acceptance.
# Keep both definitions aligned when release requirements change. Channel
# features `development` and `production` are mutually exclusive (compile error),
# so every gate runs per channel and nothing here uses `--all-features`.

name: release-gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Host /tmp is small on some runners; keep SQLite temp files on-workspace.
  TMPDIR: ${{ github.workspace }}/tmp

jobs:
  fmt:
    name: "DETERMINISTIC: format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: make fmt-check

  check:
    name: "DETERMINISTIC: check (both channels)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
      - run: make check-channels

  clippy:
    name: "DETERMINISTIC: clippy (both channels)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: make clippy

  deterministic-tests:
    name: "DETERMINISTIC: tests"
    runs-on: ubuntu-latest
    # No NVIDIA credentials are mapped into this job: several deterministic
    # tests assert fail-closed behavior when keys are absent. Live coverage
    # runs only in the credential-gated job below.
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - name: full suite, production channel (live partitioned out by default)
        run: cargo test --all-targets -j 2 -- --test-threads 2
      - name: full suite, development channel
        run: cargo test --all-targets --features development -j 2 -- --test-threads 2
      - name: release security closure (deterministic)
        run: cargo test --test phase_44_security_closure -j 2 -- --test-threads 2
      - name: reliability suite (deterministic)
        run: cargo test --test phase_43_reliability -j 2 -- --test-threads 2
      - name: release validation (deterministic)
        run: cargo test --test phase_45_release_validation -j 2 -- --test-threads 2

  live-probes:
    name: "LIVE: mandatory canonical provider acceptance"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - name: run the complete canonical live inventory
        env:
          API_KEY_NVIDIA: ${{ secrets.API_KEY_NVIDIA }}
        run: |
          if [ -z "$API_KEY_NVIDIA" ]; then
            echo "ERROR: canonical live acceptance requires API_KEY_NVIDIA; refusing a credential-blocked green result." >&2
            exit 1
          fi
          make test-live-all

  audit-advisory:
    name: "OPTIONAL: audit"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit || echo "OPTIONAL advisory gate did not pass"
