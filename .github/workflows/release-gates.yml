# M31A canonical CI release gates.
#
# Deterministic, credential-free CI gates. Live-provider acceptance is deliberately
# excluded from GitHub Actions and can be run manually when explicitly needed.
# Cargo audit remains advisory.
#
# scripts/release-check.sh defines the local pre-release gate set. Keep both
# definitions aligned when release requirements change. Channel features
# `development` and `production` are mutually exclusive (compile error), so
# every gate runs per channel and nothing here uses `--all-features`.

name: release-gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Host /tmp is small on some runners; keep SQLite temp files on-workspace.
  TMPDIR: ${{ github.workspace }}/tmp

jobs:
  fmt:
    name: "DETERMINISTIC: format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: make fmt-check

  check:
    name: "DETERMINISTIC: check (both channels)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
      - run: make check-channels

  clippy:
    name: "DETERMINISTIC: clippy (both channels)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: make clippy

  deterministic-tests:
    name: "DETERMINISTIC: tests"
    runs-on: ubuntu-latest
    # Provider credentials are intentionally absent: this job must stay deterministic
    # and must not contact live model providers.
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - name: full deterministic suite, production channel
        run: cargo test --all-targets -j 2 -- --test-threads 2
      - name: full suite, development channel
        run: cargo test --all-targets --features development -j 2 -- --test-threads 2
      - name: release security closure (deterministic)
        run: cargo test --test security_boundary_and_durable_recovery_closure -j 2 -- --test-threads 2
      - name: reliability suite (deterministic)
        run: cargo test --test production_reliability_and_failure_matrix -j 2 -- --test-threads 2
      - name: release validation (deterministic)
        run: cargo test --test release_candidate_validation_suite -j 2 -- --test-threads 2

  audit-advisory:
    name: "OPTIONAL: audit"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit || echo "OPTIONAL advisory gate did not pass"

  release-eligibility:
    name: "RELEASE ELIGIBILITY: canonical gates status"
    needs: [fmt, check, clippy, deterministic-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all mandatory gates passed
        run: echo "All required deterministic release gates passed successfully."
