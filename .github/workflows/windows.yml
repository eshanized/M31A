# Windows CI workflow for Phase 48 cross-platform verification.

name: windows-check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep SQLite temp files on-workspace
  TMPDIR: ${{ github.workspace }}\tmp

jobs:
  check:
    name: "Windows check"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p tmp
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo check --all-targets
        run: cargo check --all-targets
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test (platform-neutral + Windows-specific)
        run: |
          cargo test --test production_comment_hygiene
          cargo test --test architecture_process_authority
          cargo test --test docs_contract
          cargo test --test phase_01_events_ids_kernel
          cargo test --test phase_01_state_machines
          cargo test --test phase_11_cli
          cargo test --test phase_11_config
          cargo test --test platform -- --test-threads 1

  build:
    name: "Windows build (x86_64 + arm64)"
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p tmp
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo check
        run: cargo check --target ${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}