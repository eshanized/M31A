name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: "Build release (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm64
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-x64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: windows-arm64
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - name: Ensure temp directory exists
        run: mkdir -p tmp
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/m31a"
          PKG_NAME="m31a-${{ matrix.name }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "${BIN}" "dist/${PKG_NAME}/m31a"
          cp README.md "dist/${PKG_NAME}/"
          cp CHANGELOG.md "dist/${PKG_NAME}/"
          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          cd dist && sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/m31a.exe"
          PKG_NAME="m31a-${{ matrix.name }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "${BIN}" "dist/${PKG_NAME}/m31a.exe"
          cp README.md "dist/${PKG_NAME}/"
          cp CHANGELOG.md "dist/${PKG_NAME}/"
          cd dist && 7z a "${PKG_NAME}.zip" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || 'v0.1.0' }}"
          gh release upload "${TAG}" dist/*.${{ matrix.archive }} dist/*.sha256 --clobber
