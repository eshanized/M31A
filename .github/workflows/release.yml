name: release

# Production channel pipeline: stable user-facing artifacts for `m31a`.
# Publishing happens ONLY for published GitHub releases (or manual dispatch
# for an approved release event) — never for branch pushes. All gates
# (version, clean source, tests, identity verification) must pass first.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.10)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TMPDIR: ${{ github.workspace }}/tmp

jobs:
  gates:
    name: "production gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify clean source (dirty production source fails)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: refusing production release from a dirty tree" >&2
            git status --short >&2
            exit 1
          fi
          echo "clean source: PASS"
      - name: Verify canonical version (Cargo.toml only authority)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "${RELEASE_TAG}" 2>/dev/null || true)
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ -n "${TAG_COMMIT}" ] && [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "ERROR: tag commit (${TAG_COMMIT}) does not match checked out HEAD (${HEAD_COMMIT})" >&2
            exit 1
          fi
          CARGO_VER=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["packages"][0]["version"])')
          echo "Cargo.toml version: ${CARGO_VER}"
          echo "Release tag: ${RELEASE_TAG}"
          if [ "v${CARGO_VER}" != "${RELEASE_TAG}" ]; then
            echo "ERROR: tag ${RELEASE_TAG} disagrees with Cargo.toml v${CARGO_VER}" >&2
            exit 1
          fi
          echo "version consistency: PASS"
      - run: cargo fmt --check
      # Authoritative mandatory gates live in scripts/release-check.sh; the
      # production gate below enforces the identical set (per channel — never
      # --all-features, since development+production is a compile error).
      - run: cargo check --all-targets
      - run: cargo check --all-targets --features development
      - name: invalid channel combination must fail
        run: |
          if (cargo check --lib --features development,production 2>&1 || true) | grep -qi "mutually exclusive"; then
            echo "mutual exclusion: PASS"
          else
            echo "ERROR: development+production was NOT rejected" >&2
            exit 1
          fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features development -- -D warnings
      - name: full test suite (production channel)
        run: cargo test --all-targets -j 2 -- --test-threads 2
      - name: full test suite (development channel)
        run: cargo test --all-targets --features development -j 2 -- --test-threads 2
      - name: deployment channel suite
        run: cargo test --test deployment_channels -j 2 -- --test-threads 2

  live-acceptance:
    name: "LIVE: mandatory model acceptance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Ensure temp directory exists
        run: mkdir -p "${TMPDIR}"
      - uses: dtolnay/rust-toolchain@stable
      - name: verify credentials presence (fail-closed)
        env:
          API_KEY_NVIDIA: ${{ secrets.API_KEY_NVIDIA }}
        run: |
          if [ -z "$API_KEY_NVIDIA" ]; then
            echo "ERROR: Production release requires valid API_KEY_NVIDIA secret for live verification." >&2
            exit 1
          fi
      - name: execute authoritative live verification gate
        env:
          API_KEY_NVIDIA: ${{ secrets.API_KEY_NVIDIA }}
        run: make test-live-all
      - name: upload sanitized live acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TMPDIR }}/live-test-report.json
          if-no-files-found: warn
          retention-days: 30

  build-release:
    name: "Build production release (${{ matrix.name }})"
    needs: [gates, live-acceptance]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm64
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-x64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: windows-arm64
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Ensure temp directory exists
        run: mkdir -p tmp
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify clean source per target
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: refusing production build from a dirty tree" >&2
            exit 1
          fi

      - name: Build production binary (default channel, no dev feature)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify production identity
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/m31a"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then BIN="${BIN}.exe"; fi
          CARGO_VER=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["packages"][0]["version"])')
          # Cross-arch guard: an ARM64 binary cannot execute on an x64-only
          # runner (no emulation layer). Enforce presence/size there; execute
          # the version check everywhere else.
          case "${{ matrix.target }}" in
            aarch64-*) TARGET_ARCH="arm64" ;;
            x86_64-*) TARGET_ARCH="x64" ;;
            *) TARGET_ARCH="unknown" ;;
          esac
          if [[ "$TARGET_ARCH" == "arm64" && "${RUNNER_ARCH}" == "X64" ]]; then
            if [[ ! -s "${BIN}" ]]; then
              echo "ERROR: cross-arch binary missing or empty: ${BIN}" >&2
              exit 1
            fi
            echo "  cross-arch binary present (execution skipped on ${RUNNER_ARCH} runner)"
          else
            VER=$("${BIN}" --version)
            echo "  binary: ${VER} (expected: m31a ${CARGO_VER})"
            if [ "${VER}" != "m31a ${CARGO_VER}" ]; then
              echo "ERROR: production binary misreports version/channel" >&2
              exit 1
            fi
            "${BIN}" deployment | head -12
          fi
          echo "production identity: PASS"

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/m31a"
          VERSION=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["packages"][0]["version"])')
          COMMIT=$(git rev-parse HEAD)
          BUILD_ID=$(python3 -c "import hashlib; print(hashlib.sha256('|'.join(['${VERSION}','production','${COMMIT}','${{ matrix.target }}']).encode()).hexdigest()[:16])")
          SHA=$(sha256sum "${BIN}" | awk '{print $1}')
          SIZE=$(wc -c < "${BIN}" | tr -d ' ')
          PKG_NAME="m31a-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "${BIN}" "dist/${PKG_NAME}/m31a"
          cp README.md "dist/${PKG_NAME}/"
          cp CHANGELOG.md "dist/${PKG_NAME}/"
          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          cd dist
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          ARCH_SHA=$(sha256sum "${PKG_NAME}.tar.gz" | awk '{print $1}')
          ARCH_SIZE=$(wc -c < "${PKG_NAME}.tar.gz" | tr -d ' ')
          python3 - "${VERSION}" "${COMMIT}" "${{ matrix.target }}" "${BUILD_ID}" "${SHA}" "${SIZE}" "${PKG_NAME}.tar.gz" "${ARCH_SHA}" "${ARCH_SIZE}" <<'PYEOF'
          import sys, json
          version, commit, target, build_id, sha, size, filename, arch_sha, arch_size = sys.argv[1:10]
          manifest = {
              "schema_version": 1,
              "version": version,
              "channel": "production",
              "build_id": build_id,
              "commit": commit,
              "artifacts": [{
                  "target": target,
                  "filename": filename,
                  "sha256": arch_sha,
                  "size": int(arch_size),
                  "build_id": build_id,
                  "commit": commit,
              }],
          }
          with open(f"deployment-manifest-{target}.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF
          cat "deployment-manifest-${{ matrix.target }}.json"

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/m31a.exe"
          VERSION=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["packages"][0]["version"])')
          COMMIT=$(git rev-parse HEAD)
          BUILD_ID=$(python3 -c "import hashlib; print(hashlib.sha256('|'.join(['${VERSION}','production','${COMMIT}','${{ matrix.target }}']).encode()).hexdigest()[:16])")
          PKG_NAME="m31a-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "${BIN}" "dist/${PKG_NAME}/m31a.exe"
          cp README.md "dist/${PKG_NAME}/"
          cp CHANGELOG.md "dist/${PKG_NAME}/"
          cd dist && 7z a "${PKG_NAME}.zip" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          ARCH_SHA=$(sha256sum "${PKG_NAME}.zip" | awk '{print $1}')
          ARCH_SIZE=$(wc -c < "${PKG_NAME}.zip" | tr -d ' ')
          python3 - "${VERSION}" "${COMMIT}" "${{ matrix.target }}" "${BUILD_ID}" "${PKG_NAME}.zip" "${ARCH_SHA}" "${ARCH_SIZE}" <<'PYEOF'
          import sys, json
          version, commit, target, build_id, filename, arch_sha, arch_size = sys.argv[1:8]
          manifest = {
              "schema_version": 1,
              "version": version,
              "channel": "production",
              "build_id": build_id,
              "commit": commit,
              "artifacts": [{
                  "target": target,
                  "filename": filename,
                  "sha256": arch_sha,
                  "size": int(arch_size),
                  "build_id": build_id,
                  "commit": commit,
              }],
          }
          with open(f"deployment-manifest-{target}.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Stage workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-bin-${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.sha256
            dist/deployment-manifest-${{ matrix.target }}.json
          if-no-files-found: error

  # ── Native Linux packages: .deb, .rpm, .AppImage (x86_64 + aarch64) ─────────
  package-linux:
    name: "Linux native packages (${{ matrix.name }})"
    needs: [gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Ensure temp directory exists
        run: mkdir -p tmp
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file dpkg-dev rpm || sudo apt-get install -y libfuse2t64 file dpkg-dev rpm || true
          cargo install cargo-deb cargo-generate-rpm
      - name: Build deb, rpm, AppImage
        shell: bash
        run: |
          ./scripts/build-release.sh --format deb,rpm,appimage "${{ matrix.target }}"
          cp "dist/deployment-manifest-${{ matrix.target }}.json" "dist/deployment-manifest-${{ matrix.target }}-packages.json"
      - name: Stage workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-pkg-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.sha256
            dist/deployment-manifest-${{ matrix.target }}-packages.json
          if-no-files-found: error

  # ── macOS disk image ────────────────────────────────────────────────────────
  package-macos:
    name: "macOS disk image (${{ matrix.name }})"
    needs: [gates]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: darwin-x64
          - target: aarch64-apple-darwin
            name: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Ensure temp directory exists
        run: mkdir -p tmp
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build disk image
        shell: bash
        run: |
          ./scripts/build-release.sh --format dmg "${{ matrix.target }}"
          cp "dist/deployment-manifest-${{ matrix.target }}.json" "dist/deployment-manifest-${{ matrix.target }}-packages.json"
      - name: Stage workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-pkg-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/deployment-manifest-${{ matrix.target }}-packages.json
          if-no-files-found: error

  # ── Windows installer ───────────────────────────────────────────────────────
  package-windows:
    name: "Windows installer (${{ matrix.name }})"
    needs: [gates]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: windows-x64
          - target: aarch64-pc-windows-msvc
            name: windows-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Ensure temp directory exists
        run: mkdir tmp
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install WiX tooling
        shell: bash
        run: cargo install cargo-wix
      - name: Build installer
        shell: bash
        run: |
          ./scripts/build-release.sh --format msi "${{ matrix.target }}"
          cp "dist/deployment-manifest-${{ matrix.target }}.json" "dist/deployment-manifest-${{ matrix.target }}-packages.json"
      - name: Stage workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-pkg-${{ matrix.target }}
          path: |
            dist/*.msi
            dist/*.sha256
            dist/deployment-manifest-${{ matrix.target }}-packages.json
          if-no-files-found: error

  # ── Release validation and single-owner publication ─────────────────────────
  release-validation:
    name: "Validate release assets & publish unified release"
    needs: [build-release, package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging
          pattern: artifacts-*
          merge-multiple: true
      - name: Validate release artifacts and assemble unified manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          COMMIT=$(git rev-parse HEAD)
          python3 scripts/validate_release_manifests.py release-staging "${RELEASE_TAG}" "${COMMIT}" production
      - name: Authoritative release publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-staging/*)
          gh release upload "${RELEASE_TAG}" "${files[@]}"
