name: CI - Tests

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tier1:
    name: Test Tier 1 (Full -race)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: macos-latest
            arch: amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run tests with race detector
        run: go test -race -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
        env:
          GOARCH: ${{ matrix.arch }}
      - name: Run go vet
        run: go vet ./...
        env:
          GOARCH: ${{ matrix.arch }}
      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.arch }}
          path: coverage.out

  test-tier2:
    name: Test Tier 2 (Smoke)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: amd64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Smoke test - build binary
        run: go build -o m31a ./cmd/m31a
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
      - name: Smoke test - binary runs (version)
        if: (matrix.arch == 'amd64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64') || runner.os == 'Windows'
        run: ./m31a --version
      - name: Smoke test - at least one test passes (short)
        if: matrix.arch == 'amd64'
        run: go test -short -timeout 5m ./...
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
