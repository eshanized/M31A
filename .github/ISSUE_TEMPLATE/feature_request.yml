name: "Feature Request"
description: "Suggest an idea or enhancement for M31A"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love feedback and ideas! Tell us what you want to see improved or added to M31A.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Affected Subsystem / Component
      options:
        - CLI / Subcommands
        - TUI (Terminal User Interface)
        - Agent Engine / Vibe Loop / Speculative Arena
        - NVIDIA NIM Provider / Model Integration
        - Sandbox / ExecPolicy / Security
        - App Server / JSON-RPC Protocol
        - TypeScript SDK (@m31a/sdk)
        - Python SDK (m31a)
        - Tool Suite / Patch Engine
        - Other
    validations:
      required: true
