name: Feature Request
description: Suggest an idea for M31A
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the sections below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Why is it needed?
      placeholder: I'm frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see implemented?
      placeholder: It would be great if...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or workarounds have you considered?
      placeholder: I considered...
    validations:
      required: false
  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Who would benefit from this? What workflows would it enable?
      placeholder: As a... I want to... so that...
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Changes?
      description: Does this introduce breaking changes to public APIs, CLI, or config?
      options:
        - No
        - Yes (explain below)
    validations:
      required: true
  - type: textarea
    id: breaking-details
    attributes:
      label: Breaking Change Details
      description: If yes, describe what breaks and migration path
      placeholder: This changes...
    validations:
      required: false
  - type: dropdown
    id: extension-related
    attributes:
      label: Extension Related?
      description: Is this related to the extension system (tools, providers, hooks)?
      options:
        - No
        - Yes
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/PRs to avoid duplicates
          required: true
        - label: This aligns with M31A's guiding principles (reliability, predictability, simplicity)
          required: true