name: 'Bug Report'
description: 'Report a bug to help improve M31A'
body:
  - type: 'markdown'
    attributes:
      value: |-
        > [!IMPORTANT]
        > Thanks for reporting an issue!
        >
        > Please search **[existing issues](https://github.com/eshanized/M31A/issues)** to check whether this bug has already been reported.

  - type: 'textarea'
    id: 'problem'
    attributes:
      label: 'What happened?'
      description: 'A clear and concise description of what the bug is.'
    validations:
      required: true

  - type: 'textarea'
    id: 'expected'
    attributes:
      label: 'What did you expect to happen?'
    validations:
      required: true

  - type: 'textarea'
    id: 'info'
    attributes:
      label: 'Client information'
      description: 'Please paste the output of the `/about` command run inside M31A, along with your OS/platform.'
      value: |-
        <details>
        <summary>Client Information</summary>

        Run `m31a` to enter the interactive CLI, then run `/about`.

        ```console
        > /about
        # paste output here
        ```

        </details>
    validations:
      required: true

  - type: 'textarea'
    id: 'model-info'
    attributes:
      label: 'Model / Endpoint information'
      description: 'Which NVIDIA NIM model (or custom endpoint) were you using?'

  - type: 'textarea'
    id: 'additional-context'
    attributes:
      label: 'Anything else we need to know?'
      description: 'Add any other context or redacted logs here.'
