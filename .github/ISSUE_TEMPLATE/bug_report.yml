name: Bug Report
description: File a bug report to help us improve M31A
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible so we can reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: M31A Version
      description: What version of M31A are you running? (Run `m31a --version`)
      placeholder: "m31a 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (x86_64)
        - Linux (ARM64)
        - macOS (Apple Silicon - aarch64)
        - macOS (Intel - x86_64)
        - Windows (x86_64)
        - Windows (ARM64)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `m31a mission run "..."`
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or CLI Output
      description: Please copy and paste any relevant logs, terminal output, or stack traces.
      render: shell
