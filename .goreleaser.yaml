version: 2

project_name: m31a

before:
  hooks:
    - bash scripts/validate-release.sh

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: m31a
    main: ./cmd/m31a
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64
    hooks:
      post:
        - cd docs/examples/custom-linter && go build -o /tmp/custom-linter .
        - cd docs/examples/ollama-provider && go build -o /tmp/ollama-provider .
        - cd docs/examples/pre-commit-hook && go build -o /tmp/pre-commit-hook .

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: m31a-pkg
    package_name: m31a
    vendor: Eshan Roy
    homepage: https://github.com/eshanized/M31A
    maintainer: Eshan Roy <eshanized@proton.me>
    description: Terminal-native AI coding agent that ships, not just suggests
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: utils
    priority: optional

scoops:
  - name: m31a
    repository:
      owner: eshanized
      name: M31A
    homepage: https://github.com/eshanized/M31A
    description: Terminal-native AI coding agent
    license: MIT

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: "^feat:"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix:"
      order: 1
    - title: "Documentation"
      regexp: "^docs:"
      order: 2
    - title: "Performance"
      regexp: "^perf:"
      order: 3
    - title: "Refactoring"
      regexp: "^refactor:"
      order: 4
    - title: "Tests"
      regexp: "^test:"
      order: 5
    - title: "Other"
      order: 999

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  draft: true
  prerelease: auto
  name_template: "Release {{ .Version }}"