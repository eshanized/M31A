version: 2

project_name: m31a

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: m31a
    main: ./cmd/m31a
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: m31a-pkg
    package_name: m31a
    vendor: Eshanized
    homepage: https://github.com/eshanized/M31A
    maintainer: Eshanized <noreply@eshanized.com>
    description: Terminal-native AI coding agent that ships, not just suggests
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: utils
    priority: optional

snapcrafts:
  - id: m31a-snap
    name: m31a
    summary: Terminal-native AI coding agent
    description: M31 Autonomous is a terminal-based AI coding agent that owns a six-phase workflow end-to-end.
    base: core22
    grade: stable
    confinement: strict
    license: MIT

scoops:
  - name: m31a
    homepage: https://github.com/eshanized/M31A
    description: Terminal-native AI coding agent
    license: MIT

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

release:
  draft: true
  prerelease: auto
