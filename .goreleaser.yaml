version: 2

project_name: m31a

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: m31a
    main: ./cmd/m31a
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: m31a-pkg
    package_name: m31a
    vendor: Eshanized
    homepage: https://github.com/eshanized/M31A
    maintainer: Eshanized <noreply@eshanized.com>
    description: Terminal-native AI coding agent that ships, not just suggests
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: utils
    priority: optional

scoops:
  - name: m31a
    repository:
      owner: eshanized
      name: M31A
    homepage: https://github.com/eshanized/M31A
    description: Terminal-native AI coding agent
    license: MIT

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - Merge pull request
      - Merge branch

release:
  draft: true
  prerelease: auto
