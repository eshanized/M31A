[workspace]
resolver = "2"
members = [
    "crates/m31a-core",
    "crates/m31a-provider",
    "crates/m31a-execpolicy",
    "crates/m31a-sandbox",
    "crates/m31a-guardian",
    "crates/m31a-hooks",
    "crates/m31a-tools",
    "crates/m31a-code-mode",
    "crates/m31a-storage",
    "crates/m31a-app-server",
    "crates/m31a-extension-api",
    "crates/m31a-compaction",
    "crates/m31a-telemetry",
    "crates/m31a-collaboration-templates",
    "crates/m31a-git-attribution",
    "crates/m31a-image-generation",
    "crates/m31a-web-search",
    "crates/m31a-prompts",
    "crates/m31a-features",
    "crates/m31a-term",
    "crates/m31a-fuzzy",
    "crates/m31a-diff",
    "crates/m31a-composer",
    "crates/m31a-elicitation",
    "crates/m31a-analytics",
    "crates/m31a-agent-engine",
    "crates/m31a-cloud-tasks",
    "crates/m31a-mcp",
    "crates/m31a-patch",
    "crates/m31a-shell",
    "crates/m31a-verify",
    "crates/m31a-review",
    "crates/m31a-ast",
    "crates/m31a-trust",
    "crates/m31a-proc",
    "crates/m31a-watcher",
    "crates/m31a-browser",
    "crates/m31a-tui",
    "crates/m31a-cli",
    "examples/distributed_task_mesh",
]

[workspace.package]
version = "0.1.13"
edition = "2024"
authors = ["Eshan Roy"]
license = "MIT"
homepage = "https://m31a.tonmoyinfrastructure.org/"
repository = "https://github.com/eshanized/M31A"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.33", features = ["bundled"] }
toml = "0.8"
uuid = { version = "1.15", features = ["v4", "v7", "serde"] }
colored = "3.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
dirs = "6.0"
shlex = "2.0"
tempfile = "3.17"
regex = "1.11"
similar = "2.6"
sha1 = "0.10"
sha2 = "0.10"
chacha20poly1305 = "0.10"
semver = "1.0"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-util = "0.7"
rand = "0.10"
which = "7.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
m31a-core = { path = "crates/m31a-core" }
m31a-provider = { path = "crates/m31a-provider" }
m31a-execpolicy = { path = "crates/m31a-execpolicy" }
m31a-sandbox = { path = "crates/m31a-sandbox" }
m31a-guardian = { path = "crates/m31a-guardian" }
m31a-hooks = { path = "crates/m31a-hooks" }
m31a-tools = { path = "crates/m31a-tools" }
m31a-code-mode = { path = "crates/m31a-code-mode" }
m31a-storage = { path = "crates/m31a-storage" }
m31a-term = { path = "crates/m31a-term" }
m31a-fuzzy = { path = "crates/m31a-fuzzy" }
m31a-diff = { path = "crates/m31a-diff" }
m31a-composer = { path = "crates/m31a-composer" }
m31a-elicitation = { path = "crates/m31a-elicitation" }
m31a-analytics = { path = "crates/m31a-analytics" }
m31a-agent-engine = { path = "crates/m31a-agent-engine" }
m31a-proc = { path = "crates/m31a-proc" }
m31a-watcher = { path = "crates/m31a-watcher" }
m31a-browser = { path = "crates/m31a-browser" }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

