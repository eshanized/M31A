[package]
name = "m31a"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
authors = ["Eshan Roy <m.eshanized@gmail.com>"]
description = "M31 Autonomous — Rust-native autonomous software-engineering runtime with non-bypassable policy gates and verifiable execution"
license = "MIT OR Apache-2.0"
homepage = "https://m31a.tonmoyinfrastructure.org/"
repository = "https://github.com/eshanized/M31A"
documentation = "https://m31a.tonmoyinfrastructure.org/"
readme = "README.md"
keywords = ["autonomous", "agent", "cli", "tui", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
uuid = { version = "1.26.0", features = ["v7", "serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }
tokio = { version = "1.51", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2.3"
syn = { version = "2.0", features = ["full", "visit"] }
petgraph = { version = "0.8", features = ["serde-1"] }
toml = "0.8"
regex = "1.11"
tiktoken-rs = "0.6"
tracing = "0.1"
libc = "0.2"
tempfile = "3"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"
fuzzy-matcher = "0.3.7"
strip-ansi-escapes = "0.2.1"
semver = { version = "1", features = ["serde"] }
minijinja = { version = "2", default-features = false, features = ["serde"] }

[dev-dependencies]

[features]
default = []
live-model-tests = []
# Deployment channel (compile-time artifact identity, NOT a Cargo build
# profile). Production is the default (no feature). Enabling `development`
# stamps the artifact as DeploymentChannel::Development with isolated
# `m31a-dev` state. `production` is an empty explicit alias for documentation.
# `development` and `production` are MUTUALLY EXCLUSIVE: enabling both is a
# compile error (src/deployment/channel.rs). Gates must therefore exercise
# each channel separately (default features, then `--features development`)
# and must NOT use `--all-features` (which would select both channels).
development = []
production = []

[[test]]
name = "live_model_e2e"
required-features = ["live-model-tests"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true

[profile.test]
opt-level = 0
# Line tables only: slashes debug symbol footprint by ~85-90% to avoid memory bloat across 100+ test binaries
debug = 1
# Disable incremental compilation to eliminate disk I/O thrashing and memory overhead
incremental = false

# ── Native package metadata (consumed by release packaging, never by builds) ──
# cargo-deb reads [package.metadata.deb]; cargo-generate-rpm reads
# [package.metadata.generate-rpm]; cargo-wix reads [package.metadata.wix].
# Canonical version/description/license/homepage always come from [package]
# above — these sections only add packager-specific assets and file layout.

[package.metadata.deb]
maintainer = "Eshan Roy <m.eshanized@gmail.com>"
copyright = "2026, Eshan Roy"
license-file = ["LICENSE", "0"]
extended-description = """\
M31 Autonomous — Rust-native autonomous software-engineering runtime with \
non-bypassable policy gates and verifiable execution."""
section = "devel"
priority = "optional"
assets = [
  ["target/release/m31a", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/m31a/", "644"],
  ["CHANGELOG.md", "usr/share/doc/m31a/", "644"],
  ["LICENSE", "usr/share/doc/m31a/", "644"],
]
conflicts = "m31a-dev"
suggests = "git"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/m31a", dest = "/usr/bin/m31a", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/m31a/README.md", mode = "644" },
  { source = "CHANGELOG.md", dest = "/usr/share/doc/m31a/CHANGELOG.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/m31a/LICENSE", mode = "644" },
]
license = "MIT OR Apache-2.0"
summary = "M31 Autonomous — Rust-native autonomous software-engineering runtime"
description = "M31 Autonomous (M31A) — Rust-native autonomous software-engineering runtime with non-bypassable policy gates and verifiable execution."
conflicts = ["m31a-dev"]

[package.metadata.wix]
upgrade-guid = "B7C2A9E4-3F1D-4A6B-8C5E-9D0F1A2B3C4D"
path-guid = "C8D3BAF5-4A2E-5B7C-9D6F-0E1A2B3C4D5E"
product-name = "M31 Autonomous"
product-description = "M31 Autonomous — Rust-native autonomous software-engineering runtime"
manufacturer = "Eshan Roy"
license = "LICENSE"
binaries = ["target/release/m31a.exe"]
eula = false