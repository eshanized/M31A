[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m31a"
version = "0.1.15"
description = "Official Python SDK for the M31A Autonomous Agentic Coding Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eshan Roy" }
]
dependencies = []

[project.urls]
Homepage = "https://m31a.tonmoyinfrastructure.org/"
Repository = "https://github.com/eshanized/M31A"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
