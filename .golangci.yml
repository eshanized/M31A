version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

  settings:
    govet:
      enable:
        - shadow

    errcheck:
      check-type-assertions: false
      check-blank: false

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
