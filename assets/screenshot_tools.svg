    <text y="280.0" class="term-text"><tspan x="9.2" fill="rgb(35,42,45)">│</tspan><tspan x="18.4" fill="rgb(218,218,218)">debug_breakpoint             Built-in       Set or clear breakpoints in a file during a DAP debug session.                                                  </tspan><tspan x="1453.6" fill="rgb(35,42,45)">│</tspan></text>
    <text y="299.0" class="term-text"><tspan x="9.2" fill="rgb(35,42,45)">│</tspan><tspan x="18.4" fill="rgb(218,218,218)">debug_step                   Built-in       Step over, into, out, or continue execution in a DAP debug session.                                             </tspan><tspan x="1453.6" fill="rgb(35,42,45)">│</tspan></text>
    <text y="318.0" class="term-text"><tspan x="9.2" fill="rgb(35,42,45)">│</tspan><tspan x="18.4" fill="rgb(218,218,218)">debug_inspect                Built-in       Inspect active variables and stack frame state in a DAP debug session.                                          </tspan><tspan x="1453.6" fill="rgb(35,42,45)">│</tspan></text>
