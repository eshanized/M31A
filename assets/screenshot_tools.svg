    <text y="242.0" class="term-text"><tspan x="9.2" fill="rgb(35,42,45)">│</tspan><tspan x="18.4" fill="rgb(218,218,218)" font-weight="bold">exec_command                 Built-in       Execute a shell command inside the configured sandbox environment with standard output and exi                  </tspan><tspan x="1453.6" fill="rgb(35,42,45)">│</tspan></text>
