    <text y="356.0" class="term-text"><tspan x="9.2" fill="rgb(35,42,45)">│</tspan><tspan x="18.4" fill="rgb(218,218,218)">code_review                  Built-in       Perform an automated security, correctness, and reliability code review on uncommitted working                  </tspan><tspan x="1453.6" fill="rgb(35,42,45)">│</tspan></text>
