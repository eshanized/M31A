<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">M31A logo</title>
  <desc id="desc">A dimensional, angular letter M formed from a violet gradient ribbon.</desc>
  <defs>
    <linearGradient id="left-leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a68ff"/>
      <stop offset="0.52" stop-color="#8650ed"/>
      <stop offset="1" stop-color="#6636ca"/>
    </linearGradient>
    <linearGradient id="right-leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a66cff"/>
      <stop offset="0.48" stop-color="#8750ec"/>
      <stop offset="1" stop-color="#6738c9"/>
    </linearGradient>
    <linearGradient id="top-face" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#a978ff"/>
      <stop offset="0.48" stop-color="#bd85ff"/>
      <stop offset="1" stop-color="#a76bfa"/>
    </linearGradient>
    <linearGradient id="left-facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a69f5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6537cb" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="right-facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d09aff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#6637ce" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.55 0 0 0 0.30  0 0.20 0 0 0.08  0 0 0.95 0 0.55  0 0 0 0.42 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#soft-glow)">
    <!-- vertical legs sit behind the folded upper stroke -->
    <path d="M34 132 L151 225 V423 Q151 439 138 447 L49 395 Q34 386 34 369 Z" fill="url(#left-leg)"/>
    <path d="M361 225 L478 132 V369 Q478 386 463 395 L374 447 Q361 439 361 423 Z" fill="url(#right-leg)"/>

    <!-- subtle side facets create the dimensional, folded finish -->
    <path d="M34 132 L151 225 V423 Q151 439 138 447 L49 395 Q34 386 34 369 Z" fill="url(#left-facet)"/>
    <path d="M361 225 L478 132 V369 Q478 386 463 395 L374 447 Q361 439 361 423 Z" fill="url(#right-facet)"/>

    <!-- continuous angular M crown -->
    <path d="M38 111 L111 47 Q121 38 132 47 L256 151 L380 47 Q391 38 402 47 L474 109 Q483 117 473 126 L268 291 Q256 301 244 291 L39 126 Q29 117 38 111 Z" fill="url(#top-face)"/>

    <!-- restrained facet transitions matching the original icon -->
    <path d="M38 111 L111 47 Q121 38 132 47 L256 151 L174 223 L39 126 Q29 117 38 111 Z" fill="#9b6cf4" opacity="0.18"/>
    <path d="M256 151 L380 47 Q391 38 402 47 L474 109 Q483 117 473 126 L338 235 Z" fill="#d5a0ff" opacity="0.16"/>
    <path d="M174 223 L256 151 L338 235 L268 291 Q256 301 244 291 Z" fill="#c68aff" opacity="0.20"/>
  </g>
</svg>
