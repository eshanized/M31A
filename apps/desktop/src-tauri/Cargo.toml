[package]
name = "m31a-desktop"
version = "0.1.15"
edition = "2024"
authors = ["Eshan Roy"]
license = "MIT"
description = "Tauri 2 desktop host and authoritative runtime integration for M31A"

[package.metadata.dist]
dist = false

[lib]
name = "m31a_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "m31a-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
m31a-core = { path = "../../../crates/m31a-core" }
m31a-runtime = { path = "../../../crates/m31a-runtime" }
m31a-storage = { path = "../../../crates/m31a-storage" }
m31a-provider = { path = "../../../crates/m31a-provider" }
m31a-execpolicy = { path = "../../../crates/m31a-execpolicy" }
m31a-elicitation = { path = "../../../crates/m31a-elicitation" }
m31a-trust = { path = "../../../crates/m31a-trust" }

[dev-dependencies]
tempfile = { workspace = true }
