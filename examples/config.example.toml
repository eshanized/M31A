# M31A Configuration Reference & Template (<workspace>/.m31a/config.toml or platform user config)
# Precedence (low to high): system > user global (~/.config/m31a/config.toml) > workspace (.m31a/config.toml) > profile > environment (M31A_*) > explicit --config (CLI tier) > CLI scalars (--model/--profile/--autonomy) > session (/model, /profile)
# Provenance reports the same winning source that resolution used. Present-but-invalid files fail closed (never silently become defaults).

# Canonical execution profile id (ProfileResolver is authoritative):
# balanced, autonomous, conservative, code_reviewer, safe, coding, research, ci, security_review, release
profile = "balanced"

[provider]
# NVIDIA NIM is the only production provider in this release.
default = "nvidia_nim"

[provider.nvidia_nim]
base_url = "https://integrate.api.nvidia.com/v1"
default_model = "meta/llama-3.2-11b-vision-instruct"

[agents]
default_model = "meta/llama-3.2-11b-vision-instruct"
fast_auxiliary_model = "meta/llama-3.2-11b-vision-instruct"
max_tokens = 8192

[runtime]
concurrency_limit = 4
# Single wall-clock timeout authority (bounds worker supervision; profile wall timeouts never exceed it).
timeout_secs = 300
sandbox_mode = "standard"

[policy]
default_action = "ask"
# User preference + immutable floor: true requires Ask for mutating tools; false never weakens built-in safety (Ask never becomes Allow).
interactive_approvals = true
denied_tools = []

[git]
enabled = true
auto_commit = true
# Canonical typed values only: allow | ask | deny
push_policy = "ask"
retention_policy = "keep_on_failure"
branch_prefix = "m31a/mission"
# Canonical typed values only: required (fail-closed) | best_effort (explicit opt-in fallback)
execution_isolation = "required"

[budget]
# Unlimited means unbounded (None): omit or set no keys for unlimited mission budgets. Concurrency stays explicitly configured.
# max_agent_steps = 50
# max_model_calls = 100
# max_tokens = 1000000
# max_cost_usd = 25.0
# max_wall_clock_seconds = 3600
# max_retries = 3

[tui]
fps = 30
theme = "dark-slate-cyan"
compact_mode = false

[workflow]
research = true
research_concurrency = 4
max_discovery_turns = 4
ambiguity_threshold_percent = 15
require_charter_approval = true
require_architecture_approval = true
require_roadmap_approval = true
auto_advance = false
projection_dir = ".planning"

# Storage: canonical application state lives in platform user dirs via StorageLayout (config/data/cache/state, channel-isolated m31a vs m31a-dev).
# <workspace>/.m31a holds only workspace-scoped state (config.toml, prompts, worktrees, project artifacts). DB/credentials/model-cache/telemetry/sockets/PID are global.
# Legacy <workspace>/.m31a/m31a.db, credentials.json, cache/model_catalog.json are migration inputs only (hash-verified, never written by new code).
