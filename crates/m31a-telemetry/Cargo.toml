[package]
name = "m31a-telemetry"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
description = "Structured analytics and telemetry pipeline for M31A"

[dependencies]
anyhow = { workspace = true }
m31a-core = { path = "../m31a-core" }
rusqlite = { workspace = true }
tracing = { workspace = true }
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["tonic"] }
opentelemetry-semantic-conventions = { version = "0.33" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }